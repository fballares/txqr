name: TXQRReader
options:
  bundleIdPrefix: com.txqr
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1"
  SWIFT_VERSION: "5.0"
packages: {}
targets:
  TXQRReader:
    type: application
    platform: iOS
    sources:
      - path: TXQRReader
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.txqr.reader
      INFOPLIST_FILE: TXQRReader/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
      OTHER_LDFLAGS: "$(inherited) -framework Txqr"
    info:
      path: TXQRReader/Info.plist
      properties:
        CFBundleDisplayName: TXQR
        UILaunchScreen: {}
        NSCameraUsageDescription: TXQR needs the camera to scan multiple QR codes from your computer screen.
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
